# Cloud Build pipeline: on every push to main, build and deploy Helm to Cloud Run.
# Connect this to GitHub via:
#   gcloud builds triggers create github \
#     --name=helm-app-main \
#     --repo-owner=bensmith84-ops \
#     --repo-name=helm-app \
#     --branch-pattern=^main$ \
#     --build-config=cloudbuild.yaml \
#     --project=helm-490123
#
# After that's set up, every git push triggers a fresh build + deploy automatically.

steps:
  # 1. Build the image, baking in the NEXT_PUBLIC_ env vars
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=$_NEXT_PUBLIC_SUPABASE_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=$_NEXT_PUBLIC_SUPABASE_ANON_KEY'
      - '--build-arg'
      - 'NEXT_PUBLIC_BQ_PROXY_URL=$_NEXT_PUBLIC_BQ_PROXY_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_BQ_PROXY_TOKEN=$_NEXT_PUBLIC_BQ_PROXY_TOKEN'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=$_NEXT_PUBLIC_FIREBASE_API_KEY'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=$_NEXT_PUBLIC_FIREBASE_PROJECT_ID'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID=$_NEXT_PUBLIC_FIREBASE_APP_ID'
      - '--build-arg'
      - 'NEXT_PUBLIC_HELM_API_URL=$_NEXT_PUBLIC_HELM_API_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_USE_HELM_API=$_NEXT_PUBLIC_USE_HELM_API'
      - '--build-arg'
      - 'NEXT_PUBLIC_HELM_BACKEND=gcp'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/helm/helm-app:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/helm/helm-app:latest'
      - '.'

  # 2. Push both tags to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'us-central1-docker.pkg.dev/$PROJECT_ID/helm/helm-app']

  # 3. Deploy the new image to Cloud Run.
  #    --set-secrets pulls runtime-only secrets from Secret Manager (anything
  #    NOT prefixed NEXT_PUBLIC_ stays server-side).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'helm-app'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/helm/helm-app:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=60s'
      - '--service-account=helm-app-runtime@$PROJECT_ID.iam.gserviceaccount.com'

  # 4. Build helm-api (Express API on Cloud Run). Runs on every push so that
  #    API changes and boot-time DB migrations ship without any manual step.
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'helm-api'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/helm/helm-api:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/helm/helm-api:latest'
      - '.'

  # 5. Push helm-api image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'us-central1-docker.pkg.dev/$PROJECT_ID/helm/helm-api']

  # 6. Deploy helm-api to Cloud Run (same flags as helm-api/cloudbuild.yaml)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'helm-api'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/helm/helm-api:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=900s'
      - '--service-account=helm-app-runtime@$PROJECT_ID.iam.gserviceaccount.com'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:helm-db'
      # CUTOVER: production runs on the Google copy (helm_v2) with real PostgREST.
      - '--update-env-vars=FIREBASE_PROJECT_ID=$PROJECT_ID,PGUSER=helmuser,PGDATABASE=helm_v2,PGHOST=/cloudsql/$PROJECT_ID:us-central1:helm-db,HELM_MIRROR_SHEET_ID=1lnrkd7oSq7TAtw0hN-5lavrqx97tjll9OMNQT062iG4,POSTGREST_URL=https://helm-postgrest-qp7o2dcl5a-uc.a.run.app,REST_ENFORCE_RLS=true,REST_ALLOWED_TABLES=*,REST_ALLOWED_RPCS=*,STORAGE_BACKEND=gcs,HELM_APP_URL=https://helm-app-qp7o2dcl5a-uc.a.run.app,APP_URL=https://helm-app-qp7o2dcl5a-uc.a.run.app,OAUTH_REDIRECT_BASE=https://helm-api-qp7o2dcl5a-uc.a.run.app'
      - '--update-secrets=PGPASSWORD=helm-db-password:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,SLACK_BOT_TOKEN=slack-bot-token:latest,SLACK_SIGNING_SECRET=SLACK_SIGNING_SECRET:latest,CRON_SHARED_SECRET=CRON_SHARED_SECRET:latest,QBO_CLIENT_ID=QBO_CLIENT_ID:latest,QBO_CLIENT_SECRET=QBO_CLIENT_SECRET:latest,RAMP_CLIENT_ID=RAMP_CLIENT_ID:latest,METABASE_API_KEY=METABASE_API_KEY:latest,ASANA_PAT=ASANA_PAT:latest,RESEND_API_KEY=RESEND_API_KEY:latest,LIVEKIT_URL=LIVEKIT_URL:latest,LIVEKIT_API_KEY=LIVEKIT_API_KEY:latest,LIVEKIT_API_SECRET=LIVEKIT_API_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest'

  # 6a. PostgREST image (used by helm-postgrest below).
  - name: 'gcr.io/cloud-builders/docker'
    id: postgrest-build
    waitFor: ['-']
    allowFailure: true
    dir: 'gcp-migration/postgrest'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/helm/helm-postgrest:$SHORT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    id: postgrest-push
    waitFor: ['postgrest-build']
    allowFailure: true
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/helm/helm-postgrest:$SHORT_SHA']

  # 6a-prod. PostgREST for production on helm_v2 (IAM-private; only helm-api calls it).
  #          Unused until the cutover sets POSTGREST_URL on helm-api.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: postgrest-prod
    waitFor: ['postgrest-push']
    allowFailure: true
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'helm-postgrest'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/helm/helm-postgrest:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--service-account=helm-app-runtime@$PROJECT_ID.iam.gserviceaccount.com'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:helm-db'
      - '--update-env-vars=PGUSER=helmuser,PGDATABASE=helm_v2,PGHOST=/cloudsql/$PROJECT_ID:us-central1:helm-db'
      - '--update-secrets=PGPASSWORD=helm-db-password:latest'
  # 7. Build and register the Supabase -> Cloud SQL copy job (run on demand from
  #    the Cloud Run Jobs console; never executed by this build). allowFailure
  #    so the app deploy above is never blocked by it, e.g. before the
  #    SUPABASE_DB_URL secret exists.
  - name: 'gcr.io/cloud-builders/docker'
    id: resync-ctx
    allowFailure: true
    entrypoint: bash
    args: ['-c', 'rm -rf resync-ctx && mkdir -p resync-ctx && cp gcp-migration/resync/* resync-ctx/ && cp -r helm-api/migrations resync-ctx/migrations']
  - name: 'gcr.io/cloud-builders/docker'
    id: resync-build
    allowFailure: true
    dir: 'resync-ctx'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/helm/helm-resync:$SHORT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    id: resync-push
    allowFailure: true
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/helm/helm-resync:$SHORT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: resync-job
    allowFailure: true
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'helm-resync'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/helm/helm-resync:$SHORT_SHA'
      - '--region=us-central1'
      - '--tasks=1'
      - '--max-retries=0'
      - '--task-timeout=6h'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--service-account=helm-app-runtime@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-cloudsql-instances=$PROJECT_ID:us-central1:helm-db'
      - '--set-env-vars=PGUSER=helmuser,SRC_DB=helm,TARGET_DB=helm_v2'
      - '--set-secrets=SUPABASE_DB_URL=SUPABASE_DB_URL:latest,PGPASSWORD=helm-db-password:latest'
  # 7b. File copy job (same image): Supabase Storage -> Cloud Storage. Run on demand.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: files-copy-job
    allowFailure: true
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'helm-files-copy'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/helm/helm-resync:$SHORT_SHA'
      - '--command=/copy-files.sh'
      - '--region=us-central1'
      - '--tasks=1'
      - '--max-retries=0'
      - '--task-timeout=6h'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--service-account=helm-app-runtime@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-cloudsql-instances=$PROJECT_ID:us-central1:helm-db'
      - '--set-env-vars=PGUSER=helmuser,LIST_DB=helm_v2,GCS_BUCKET=helm-496923-files-private'
      - '--set-secrets=SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,PGPASSWORD=helm-db-password:latest'

  # 8. Cloud Scheduler jobs for the database/maintenance work that ran in
  #    Supabase pg_cron. Created if missing (existing jobs are left as they are); OIDC as the Helm
  #    runtime account (no secret in the job). allowFailure: never blocks deploys.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: scheduler-jobs
    allowFailure: true
    entrypoint: bash
    args:
      - '-c'
      - |
        set -u
        URI=https://helm-api-qp7o2dcl5a-uc.a.run.app/cron
        SA=helm-app-runtime@$PROJECT_ID.iam.gserviceaccount.com
        upsert() {
          local name="$$1" sched="$$2" tz="$${3:-Etc/UTC}" verb=create
          if gcloud scheduler jobs describe "$$name" --location=us-central1 >/dev/null 2>&1; then
            # Keep an existing job's schedule in line with this file.
            gcloud scheduler jobs update http "$$name" --location=us-central1 --schedule="$$sched" --time-zone="$$tz" >/dev/null \
              && echo "scheduler: $$name schedule $$sched ($$tz)" || echo "scheduler: update $$name FAILED"
            return 0
          fi
          gcloud scheduler jobs create http "$$name" --location=us-central1 --schedule="$$sched" --time-zone="$$tz" \
            --uri="$$URI" --http-method=POST --headers=Content-Type=application/json \
            --message-body="{\"job\":\"$$name\"}" --oidc-service-account-email="$$SA" --oidc-token-audience="$$URI" \
            --attempt-deadline=900s && echo "scheduler: $$verb $$name ok" || echo "scheduler: $$verb $$name FAILED"
        }
        upsert fin-spend-match-daily '0 6 * * *'
        upsert cx-wake-snoozed '*/5 * * * *'
        upsert cx-detect-spikes '0 * * * *'
        upsert cx-competitor-classify '*/15 * * * *'
        upsert fin-vendor-spend-refresh '15 * * * *'
        upsert notifications-prune-daily '0 7 * * *'
        upsert dp-daily-sync '0 5 * * *'
        upsert dp-daily-sync-verify '45 5 * * *'
        upsert notification-dispatch '*/5 * * * *'
        upsert shopify-backfill-tick '* * * * *'
        upsert warehouse-sync '30 3 * * *' America/New_York

  # Custom domain (helm.earthbreeze.com): Firebase Hosting forwards every request
  # to the helm-app service. Needs Firebase Hosting Admin on the build account.
  # Allowed to fail so a hosting problem never blocks an app/API release.
  - id: firebase-hosting
    name: 'node:20'
    entrypoint: bash
    allowFailure: true
    args:
      - '-c'
      - 'npx -y firebase-tools@13.29.1 deploy --only hosting --project $PROJECT_ID --non-interactive'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/helm/helm-app:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/helm/helm-app:latest'

options:
  # bigger machine = faster builds, especially for a Next.js app with 40 components
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: '2400s'  # 40 minutes: main + preview Next.js builds

# Substitution variables — supply via the trigger config OR override at trigger time.
# These default to empty so cloudbuild.yaml validates; the trigger must set them.
substitutions:
  _NEXT_PUBLIC_SUPABASE_URL: 'https://upbjdmnykheubxkuknuj.supabase.co'
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
  _NEXT_PUBLIC_BQ_PROXY_URL: ''
  _NEXT_PUBLIC_BQ_PROXY_TOKEN: ''
  _NEXT_PUBLIC_FIREBASE_API_KEY: ''
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ''
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: ''
  _NEXT_PUBLIC_FIREBASE_APP_ID: ''
  _NEXT_PUBLIC_HELM_API_URL: ''
  _NEXT_PUBLIC_USE_HELM_API: 'false'
